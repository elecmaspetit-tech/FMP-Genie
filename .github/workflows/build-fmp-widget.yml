name: Build FMP widget V1.3 live capture
on:
  push:
    paths:
      - "android-widget/**"
      - ".github/workflows/build-fmp-widget.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract V1.3 live source and verify
        run: |
          mkdir -p build-fmp-widget
          tar -xJf android-widget/source-v1.3.tar.xz -C build-fmp-widget
          cd build-fmp-widget
          python3 tests/check_project.py
          bash tests/run_parser_tests.sh
      - name: Build debug APK
        working-directory: build-fmp-widget
        run: gradle --no-daemon assembleDebug
      - name: Validate APK and permissions
        run: |
          APK="build-fmp-widget/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT=$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump permissions "$APK" | tee /tmp/fmp-permissions.txt
          ! grep -q 'android.permission.INTERNET' /tmp/fmp-permissions.txt
          ! grep -q 'android.permission.BIND_ACCESSIBILITY_SERVICE' /tmp/fmp-permissions.txt
          grep -q 'android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION' /tmp/fmp-permissions.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FMP-Mes-Transferts-V1-3-Live-APK
          path: build-fmp-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Release V1.3 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="fmp-widget-v1.3.0"
          APK="FMP_Mes_Transferts_V1_3_Lecture_Direct.apk"
          cp build-fmp-widget/app/build/outputs/apk/debug/app-debug.apk "$APK"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "FMP Mes Transferts V1.3 - lecture ecran volontaire" --notes "Version experimentale: partage volontaire de l'application FMP via Android, reconnaissance de texte sur l'appareil via ML Kit et mise a jour du widget avec les joueurs/offres visibles. Aucune API officielle, aucune actualisation quand FMP n'est pas visible, aucune enchere envoyee. Sans accessibilite ni Internet. Android peut demander de desinstaller les versions precedentes si signatures debug differentes." --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" "$APK" --clobber