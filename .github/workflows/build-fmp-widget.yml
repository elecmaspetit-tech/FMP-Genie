name: Build FMP Android Samsung widget V1.2
on:
  push:
    paths:
      - "android-widget/**"
      - ".github/workflows/build-fmp-widget.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unpack source and remove sensitive permissions
        run: |
          mkdir -p build-fmp-widget
          tar -xJf android-widget/source.tar.xz -C build-fmp-widget
          python3 android-widget/patch-safe-v1.1.py
          python3 -m pip install --disable-pip-version-check pillow
          python3 android-widget/patch-widget-v1.2.py
          cd build-fmp-widget
          if [ -f tests/check_project.py ]; then python3 tests/check_project.py; fi
          if [ -f tests/run_parser_tests.sh ]; then bash tests/run_parser_tests.sh; fi
      - name: Build debug APK
        working-directory: build-fmp-widget
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: |
          test -s build-fmp-widget/app/build/outputs/apk/debug/app-debug.apk
          unzip -t build-fmp-widget/app/build/outputs/apk/debug/app-debug.apk | tail -n 1
          ! grep -R -q "BIND_ACCESSIBILITY_SERVICE" build-fmp-widget/app/src/main/
          ! grep -R -q "android.permission.INTERNET" build-fmp-widget/app/src/main/
      - name: Publish installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FMP-Mes-Transferts-V1-2-Samsung-APK
          path: build-fmp-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish GitHub release (safe manual tracking build)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="fmp-widget-v1.2.0"
          APK="FMP_Mes_Transferts_V1_2_Samsung.apk"
          cp build-fmp-widget/app/build/outputs/apk/debug/app-debug.apk "$APK"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "FMP Mes Transferts V1.2 - widget Samsung" --notes "Widget 4x2 Android avec apercu corrige, confirmation de placement, indications en cas de refus du lanceur Samsung. Sans lecture automatique de FMP ni encheres reelles. Ne demande pas de permissions sensibles. La signature debug peut differer de V1.1: une desinstallation pourrait etre necessaire (perte des donnees locales)." --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" "$APK" --clobber
