name: Build and publish FMP Android widget APK
on:
  push:
    paths:
      - "android-widget/**"
      - ".github/workflows/build-fmp-widget.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unpack Android source
        run: |
          mkdir -p build-fmp-widget
          tar -xJf android-widget/source.tar.xz -C build-fmp-widget
      - name: Build debug APK
        working-directory: build-fmp-widget
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: |
          test -s build-fmp-widget/app/build/outputs/apk/debug/app-debug.apk
          unzip -t build-fmp-widget/app/build/outputs/apk/debug/app-debug.apk | tail -n 1
      - name: Publish installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FMP-Mes-Transferts-debug-APK
          path: build-fmp-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct-download GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="fmp-widget-v1.0.0"
          APK="FMP_Mes_Transferts_V1_Android.apk"
          cp build-fmp-widget/app/build/outputs/apk/debug/app-debug.apk "$APK"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "FMP Mes Transferts Android V1.0" --notes "Version expérimentale du widget Android de transferts FMP. APK signé en mode développement. Les enchères réelles ne sont pas encore connectées." --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" "$APK" --clobber
