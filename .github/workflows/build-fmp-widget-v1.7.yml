name: Build FMP Mes Transferts V1.7 - compte a rebours
on:
  push:
    paths:
      - "android-widget/countdown-v1.7.patch"
      - ".github/workflows/build-fmp-widget-v1.7.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore V1.6 base and apply tested V1.7 countdown patch
        run: |
          base64 -d android-widget/source-v1.6.b64.txt > /tmp/fmp-v1.6.tar.xz
          echo "9da8ad5e05e8388b4ea68c851c18e047e656f327ba3df3e84c092ae64a9a6101  /tmp/fmp-v1.6.tar.xz" | sha256sum -c -
          mkdir -p build-fmp-widget
          tar -xJf /tmp/fmp-v1.6.tar.xz -C build-fmp-widget
          cd build-fmp-widget
          git apply --check ../android-widget/countdown-v1.7.patch
          git apply ../android-widget/countdown-v1.7.patch
      - name: Run project and deadline tests
        working-directory: build-fmp-widget
        run: |
          python3 tests/check_project.py
          bash tests/run_parser_tests.sh
          bash tests/run_countdown_tests.sh
      - name: Compile Android debug APK
        working-directory: build-fmp-widget
        run: gradle --no-daemon assembleDebug
      - name: Verify APK version and security
        run: |
          APK="build-fmp-widget/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT=$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionName='1.7.0'" /tmp/badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt
          ! grep -q 'android.permission.INTERNET' /tmp/permissions.txt
          ! grep -q 'android.permission.BIND_ACCESSIBILITY_SERVICE' /tmp/permissions.txt
          grep -q 'FOREGROUND_SERVICE_MEDIA_PROJECTION' /tmp/permissions.txt
          sha256sum "$APK"
      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FMP-Mes-Transferts-V1-7-APK
          path: build-fmp-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK V1.7 direct download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="fmp-widget-v1.7.0"
          APK="FMP_Mes_Transferts_V1_7_Compte_a_Rebours.apk"
          cp build-fmp-widget/app/build/outputs/apk/debug/app-debug.apk "$APK"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "FMP Mes Transferts V1.7 - compte a rebours" --notes "Compte a rebours en temps reel des echeances estimees lues via OCR sur la page FMP. Application: horloge actualisee chaque seconde lorsqu'elle est ouverte. Widget: Chronometer natif Android, sans service permanent. Memorise l'heure de fin absolue, preserve l'echeance entre captures, et indique quand l'echeance estimee est atteinte. Un rappel inexact sans reveil du telephone actualise le widget apres l'echeance, mais Android peut le retarder. Les durees OCR arrondies rendent l'echeance approximative. Sans permissions INTERNET ni accessibilite. Aucun achat automatique. APK signe en mode debug: en cas d'incompatibilite de signature, desinstaller l'ancienne version, ce qui supprime ses donnees locales." --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" "$APK" --clobber
