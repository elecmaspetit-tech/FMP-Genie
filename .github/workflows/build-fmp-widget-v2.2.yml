name: Build FMP Mes Transferts V2.2 multi-clubs and scroll
on:
  push:
    paths:
      - "android-widget/source-v2.2.b64.txt"
      - ".github/workflows/build-fmp-widget-v2.2.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract validated full V2.2 source
        run: |
          base64 -d android-widget/source-v2.2.b64.txt > /tmp/fmp-v2.2.tar.xz
          echo "3f19cb71eca87d910a9f4e784ad18ad736fd0edc022438f447b822b31c4642f9  /tmp/fmp-v2.2.tar.xz" | sha256sum -c -
          mkdir -p build-fmp-widget
          tar -xJf /tmp/fmp-v2.2.tar.xz -C build-fmp-widget
      - name: Test multi-club, OCR regression and countdown
        working-directory: build-fmp-widget
        run: |
          python3 tests/check_project.py
          bash tests/run_parser_tests.sh
          bash tests/run_countdown_tests.sh
          bash tests/run_club_tests.sh
          node --check firefox/FMP_Direct_Bridge_V2_2.user.js
          node tests/test_userscript.js
          node tests/test_v22_clubs.js
          grep -q "ListView" app/src/main/res/layout/fmp_widget.xml
          grep -q "android.permission.BIND_REMOTEVIEWS" app/src/main/AndroidManifest.xml
      - name: Build Android APK
        working-directory: build-fmp-widget
        run: gradle --no-daemon assembleDebug
      - name: Verify APK installability and permissions
        run: |
          APK="build-fmp-widget/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT=$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | tee /tmp/fmp-v22-badging.txt
          grep -q "versionName='2.2.0'" /tmp/fmp-v22-badging.txt
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump permissions "$APK" | tee /tmp/fmp-v22-permissions.txt
          grep -q 'android.permission.FOREGROUND_SERVICE_DATA_SYNC' /tmp/fmp-v22-permissions.txt
          ! grep -q 'android.permission.BIND_ACCESSIBILITY_SERVICE' /tmp/fmp-v22-permissions.txt
          sha256sum "$APK"
      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FMP-Mes-Transferts-V2-2-APK
          path: build-fmp-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish Android APK, Firefox userscript and source on GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="fmp-widget-v2.2.0"
          APK="FMP_Mes_Transferts_V2_2_MultiClubs.apk"
          SCRIPT="FMP_Direct_Bridge_V2_2.user.js"
          SOURCE="FMP_Mes_Transferts_V2_2_SOURCE.zip"
          cp build-fmp-widget/app/build/outputs/apk/debug/app-debug.apk "$APK"
          cp build-fmp-widget/firefox/FMP_Direct_Bridge_V2_2.user.js "$SCRIPT"
          cd build-fmp-widget
          zip -qr "../$SOURCE" . -x '*.class' 'app/build/*' '.gradle/*'
          cd ..
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "FMP Mes Transferts V2.2 - clubs et liste defilante" --notes "Widget Android avec liste de joueurs verticale, fleches pour 3 clubs geres (Circle SC, Kazakh Very Nice United, Chicken Run SC), onglets de categorie. New Zealand (NT) et selections NT exclues. Transferts Firefox isoles par club avec detection FMPbar si marqueur fiable et choix manuel sinon. Anciennes lectures OCR sans club dans A classer. Aucun achat auto. APK debug avec signature potentiellement differente des anciennes versions; sauvegarder les donnees avant desinstallation. Lecture officielle FMP et compte a rebours inchanges. Precision sur le Samsung a confirmer."
          fi
          gh release upload "$TAG" "$APK" "$SCRIPT" "$SOURCE" --clobber
