name: Build FMP widget V1.5 OCR
on:
  push:
    paths:
      - "android-widget/patch-widget-v1.5.py"
      - ".github/workflows/build-fmp-widget-v1.5.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract V1.4 base and apply V1.5 fixes
        run: |
          mkdir -p build-fmp-widget
          tar -xJf android-widget/source-v1.4.tar.xz -C build-fmp-widget
          python3 android-widget/patch-widget-v1.5.py
          cd build-fmp-widget
          python3 tests/check_project.py
          bash tests/run_parser_tests.sh
      - name: Build debug APK
        working-directory: build-fmp-widget
        run: gradle --no-daemon assembleDebug
      - name: Verify APK version and permissions
        run: |
          APK="build-fmp-widget/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT=$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep "versionName='1.5.0'"
          "$AAPT" dump permissions "$APK" | tee /tmp/fmp-permissions.txt
          ! grep -q 'android.permission.INTERNET' /tmp/fmp-permissions.txt
          ! grep -q 'android.permission.BIND_ACCESSIBILITY_SERVICE' /tmp/fmp-permissions.txt
          grep -q 'android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION' /tmp/fmp-permissions.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FMP-Mes-Transferts-V1-5-APK
          path: build-fmp-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish installable debug APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="fmp-widget-v1.5.0"
          APK="FMP_Mes_Transferts_V1_5_OCR_Favoris.apk"
          cp build-fmp-widget/app/build/outputs/apk/debug/app-debug.apk "$APK"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "FMP Mes Transferts V1.5 - correction des favoris" --notes "Ameliore la lecture OCR volontaire de la page d'offres FMP : double passage OCR local pour les caracteres peu contrastes, extraction des montants corrigee, tests sur deux favoris, diagnostic partage uniquement avec accord. Sans permission Internet, sans accessibilite et sans encheres automatiques. Montants et delais a confirmer dans FMP. Version experimentale." --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" "$APK" --clobber
